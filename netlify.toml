[build]
  publish = "dist"
  command = "npm run build"

# SPA redirect - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ======================
# CACHE HEADERS
# ======================

# HTML pages - short cache, must revalidate for fresh content
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed static assets (JS, CSS) - immutable, cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Background images
[[headers]]
  for = "/backgrounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Speaker images
[[headers]]
  for = "/speakers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Moderator images
[[headers]]
  for = "/moderators/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Event page images
[[headers]]
  for = "/eventpages/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Andhra Yuva Sankalp images
[[headers]]
  for = "/ays/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Locales (JSON translation files)
[[headers]]
  for = "/locales/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# WebP images at root
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PNG images at root
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# JPG images at root
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ICO files (favicon)
[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SVG files
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts (if any)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sitemap and robots.txt
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
